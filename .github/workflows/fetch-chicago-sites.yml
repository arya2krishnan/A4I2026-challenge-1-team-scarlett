# Re-fetch the City of Chicago site snapshots in data/chicago/sites/ (tools/fetch_chicago_sites.py).
# Runs when the fetch tool changes on a non-main branch, or manually (Actions tab -> "Fetch Chicago sites"
# -> Run workflow, once this file is on main). On a feature branch it commits the refreshed CSVs to that
# branch; on main it never commits (team rule: no direct commits to main) and uploads an artifact instead.
name: Fetch Chicago sites
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [tools/fetch_chicago_sites.py, .github/workflows/fetch-chicago-sites.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/fetch_chicago_sites.py
      - name: Commit to this branch (never main)
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chicago/sites
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "data: refresh Chicago site snapshots ($(date -u +%Y-%m-%d))"
          git push
      - name: Upload snapshot (main)
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: chicago-sites
          path: data/chicago/sites
